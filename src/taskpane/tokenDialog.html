        async function submitCredentials() {
          const apiKey = document.getElementById("apiKey").value.trim();
          const clientId = document.getElementById("clientId").value.trim();
          const authToken = document.getElementById("authToken").value.trim();
          const status = document.getElementById("status");
          const submitBtn = document.getElementById("submitBtn");

          // Reset status
          status.style.display = "none";
          status.className = "";

          if (!authToken) {
            showStatus("Auth Token is required.", "error");
            return;
          }

          submitBtn.disabled = true;
          submitBtn.textContent = "Submitting...";
          showStatus("Submitting token...", "loading");

          try {
            const message = JSON.stringify({
              type: "success",
              apiKey,
              clientId,
              authToken
            });

            console.log("Sending message to parent:", message);
            Office.context.ui.messageParent(message);

            showStatus("Token submitted! Closing dialog...", "success");

            setTimeout(() => {
              try {
                Office.context.ui.messageParent(JSON.stringify({ type: "close" }));
              } catch (e) {
                console.log("Dialog already closed");
              }
            }, 1000);
          } catch (err) {
            console.error("Error:", err);
            showStatus(`Error: ${err.message}`, "error");
          } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = "Submit";
          }
        }

        function showStatus(message, type) {
            const status = document.getElementById("status");
            status.textContent = message;
            status.className = type;
            status.style.display = "block";
        }
